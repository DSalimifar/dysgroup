<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="وب‌سایت رسمی گروه DYS Group به‌زودی راه‌اندازی می‌شود.">
  <title>DYS Group | به‌زودی</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#24344d 0%,#101827 52%,#0a111d 100%);color:#f7f8fb;font-family:Vazirmatn,Tahoma,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(720px,100%);text-align:center;padding:56px 28px;border:1px solid rgba(220,190,125,.24);border-radius:26px;background:rgba(255,255,255,.035);box-shadow:0 24px 80px rgba(0,0,0,.28)}
    .mark{font-family:Arial,sans-serif;direction:ltr;font-size:clamp(42px,10vw,68px);font-weight:800;letter-spacing:3px;color:#e0c58c;margin:0}
    .line{width:76px;height:2px;background:#b99a5c;margin:24px auto}
    h1{font-size:clamp(28px,6vw,42px);margin:0 0 14px;font-weight:700}
    .lead{font-size:17px;line-height:2;color:#d5dbe5;margin:0 auto;max-width:540px}
    .en{direction:ltr;font:500 12px Arial,sans-serif;letter-spacing:3px;color:#b9c2d0;margin-top:42px}
    .foot{font-size:12px;color:#8995a8;margin-top:28px}
  </style>
</head>
<body>
  <main>
    <p class="mark">D&Y-S</p>
    <div class="line"></div>
    <h1>به‌زودی می‌آییم</h1>
    <p class="lead">وب‌سایت رسمی گروه DYS Group در حال آماده‌سازی است.<br>به‌زودی با معرفی مجموعه، حوزه‌های فعالیت و فرصت‌های همکاری در کنار شما خواهیم بود.</p>
    <p class="en">DYS GROUP&nbsp; · &nbsp;COMING SOON</p>
    <p class="foot">dysgroup.ir</p>
  </main>
</body>
</html>
